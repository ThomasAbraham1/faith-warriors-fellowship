<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Amber circle background (matches navbar logo) -->
  <circle cx="32" cy="32" r="32" fill="#D97706"/>

  <!-- Subtle radial glow for depth -->
  <radialGradient id="glow" cx="40%" cy="35%" r="60%">
    <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
  </radialGradient>
  <circle cx="32" cy="32" r="32" fill="url(#glow)"/>

  <!-- White cross (FaCross shape) -->
  <!-- Vertical beam -->
  <rect x="27.5" y="10" width="9" height="44" rx="2" fill="white"/>
  <!-- Horizontal beam (upper third, traditional cross proportion) -->
  <rect x="13" y="22" width="38" height="9" rx="2" fill="white"/>
</svg>